# Prod env: stable immutable tag and zero-downtime rollout size.
image:
  repository: nginx
  tag: "alpine"        # public image — proves the GitOps loop without registry auth
  pullPolicy: IfNotPresent

replicaCount: 3         # enough pods to absorb rolling updates without dropping traffic

env:
  - name: APP_ENV
    value: "prod"
  - name: LOG_LEVEL
    value: "warn"
