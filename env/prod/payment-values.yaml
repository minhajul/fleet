# Prod env: stable immutable tag and zero-downtime rollout size.
image:
  repository: ghcr.io/minhajul/payment-service
  tag: "" # promote the tag you vetted in staging
  pullPolicy: IfNotPresent
replicaCount: 3 # enough pods to absorb rolling updates without dropping traffic
env:
  - name: APP_ENV
    value: "prod"
  - name: LOG_LEVEL
    value: "warn"
